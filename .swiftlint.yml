included:
  - Sources
  - Tests

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - sorted_imports

disabled_rules:
  - todo

# The AXUIElement / AXValue casts in AccessibilityBridge are the documented CFType idiom.
force_cast: warning

line_length:
  warning: 140
  error: 200
  ignores_comments: true

identifier_name:
  min_length: 1        # single-letter loop/tuple names are fine
  excluded: [id, r, ns]

type_name:
  min_length: 3

file_length:
  warning: 500
