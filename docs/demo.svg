<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 12; }
      .label { fill: #8b949e; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
      .mono { font-family: 'SF Mono', ui-monospace, 'Menlo', monospace; font-size: 20px; fill: #c9d1d9; }
      .halfsel { fill: #1f6feb; opacity: .35; }
      .fullsel { fill: #238636; opacity: .35; }
      .tag { font-size: 12px; font-weight: 700; }
      .bad { fill: #f85149; }
      .good { fill: #3fb950; }
      .title { fill: #f0f6fc; font-size: 22px; font-weight: 700; }
      .sub { fill: #8b949e; font-size: 14px; }
    </style>
  </defs>

  <rect class="bg" width="960" height="360" rx="16"/>
  <text x="40" y="52" class="title">SmartSelect</text>
  <text x="40" y="78" class="sub">Double-click still selects — it just stops chopping things in half.</text>

  <!-- BEFORE -->
  <text x="40" y="128" class="label">BEFORE — native double-click</text>
  <rect x="40" y="144" width="400" height="72" class="card" rx="12"/>
  <rect x="60" y="168" width="70" height="28" class="halfsel" rx="4"/>
  <text x="60" y="188" class="mono">jane.doe@acme.co</text>
  <text x="60" y="240" class="tag bad">✕ grabbed only "jane"</text>

  <!-- AFTER -->
  <text x="520" y="128" class="label">AFTER — SmartSelect</text>
  <rect x="520" y="144" width="400" height="72" class="card" rx="12"/>
  <rect x="540" y="168" width="188" height="28" class="fullsel" rx="4"/>
  <text x="540" y="188" class="mono">jane.doe@acme.co</text>
  <text x="540" y="240" class="good tag">✓ grabbed the whole address</text>

  <text x="40" y="312" class="sub">Same gesture. Same Cmd+C. It just snaps to the whole email, number, URL, date, or path.</text>
  <text x="40" y="334" class="sub" font-style="italic">Replace this placeholder with a real screen-recording GIF at docs/demo.gif.</text>
</svg>
