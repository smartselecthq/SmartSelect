<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SmartSelect logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7DFF"/>
      <stop offset="1" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App-icon rounded square -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="232" rx="108" fill="url(#sheen)"/>

  <!-- Selection highlight covering the whole token -->
  <rect x="126" y="214" width="260" height="84" rx="16" fill="#ffffff" fill-opacity="0.22"/>

  <!-- The token: glyph blocks, fully inside the selection -->
  <g fill="#ffffff">
    <rect x="150" y="240" width="34" height="32" rx="6"/>
    <rect x="196" y="240" width="20" height="32" rx="6"/>
    <rect x="228" y="240" width="34" height="32" rx="6"/>
    <rect x="274" y="240" width="20" height="32" rx="6"/>
    <rect x="306" y="240" width="34" height="32" rx="6"/>
  </g>

  <!-- Selection handles at each end (iOS-style bar + knob) -->
  <g fill="#ffffff">
    <circle cx="126" cy="206" r="14"/>
    <rect x="122" y="206" width="8" height="100" rx="4"/>
    <circle cx="386" cy="306" r="14"/>
    <rect x="382" y="206" width="8" height="100" rx="4"/>
  </g>
</svg>
